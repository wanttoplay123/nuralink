services:
  - type: web
    name: nurselink
    runtime: static
    buildCommand: npm run build:web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
